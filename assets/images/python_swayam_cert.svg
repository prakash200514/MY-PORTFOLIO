<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Card Background & Border -->
  <rect x="0" y="0" width="1000" height="700" fill="url(#bg-gradient)"/>
  <rect x="15" y="15" width="970" height="670" fill="none" stroke="#b91c1c" stroke-width="4"/>
  <rect x="22" y="22" width="956" height="656" fill="none" stroke="#b91c1c" stroke-width="1"/>

  <!-- Top Header Logos & Titles -->
  <!-- SWAYAM Logo area -->
  <g transform="translate(60, 45)">
    <rect x="0" y="0" width="160" height="50" fill="#0284c7" rx="6"/>
    <text x="80" y="32" font-family="'Montserrat', 'Segoe UI', sans-serif" font-weight="900" font-size="24" fill="#ffffff" text-anchor="middle" letter-spacing="1">swayam</text>
    <text x="80" y="45" font-family="sans-serif" font-size="8" fill="#e0f2fe" text-anchor="middle">FREE ONLINE EDUCATION</text>
  </g>

  <!-- Emblem Center -->
  <g transform="translate(470, 40)">
    <path d="M30 0 L40 20 L60 20 L44 32 L50 52 L30 40 L10 52 L16 32 L0 20 L20 20 Z" fill="#d97706"/>
    <text x="30" y="65" font-family="serif" font-size="10" fill="#78350f" text-anchor="middle" font-weight="bold">सत्यमेव जयते</text>
  </g>

  <!-- Dibrugarh University Logo area -->
  <g transform="translate(780, 35)">
    <circle cx="50" cy="50" r="42" fill="none" stroke="#1e3a8a" stroke-width="4"/>
    <circle cx="50" cy="50" r="36" fill="none" stroke="#1e3a8a" stroke-width="1.5"/>
    <text x="50" y="55" font-family="serif" font-weight="bold" font-size="14" fill="#1e3a8a" text-anchor="middle">DU</text>
    <path id="text-path" d="M 15 50 A 35 35 0 1 1 85 50" fill="none"/>
    <text font-family="sans-serif" font-size="8" font-weight="bold" fill="#1e3a8a"><textPath href="#text-path" startOffset="50%" text-anchor="middle">DIBRUGARH UNIVERSITY</textPath></text>
  </g>

  <!-- Main Title -->
  <text x="500" y="145" font-family="'Georgia', 'Times New Roman', serif" font-size="30" font-weight="bold" fill="#991b1b" text-anchor="middle" letter-spacing="2">SWAYAM ONLINE COURSE CERTIFICATION</text>

  <!-- Subtitle Text -->
  <text x="500" y="195" font-family="'Georgia', serif" font-style="italic" font-size="20" fill="#334155" text-anchor="middle">This certificate is awarded to</text>
  
  <text x="500" y="240" font-family="'Georgia', serif" font-weight="bold" font-size="32" fill="#0f172a" text-anchor="middle">M Marimuthu Prakash</text>
  
  <text x="500" y="280" font-family="'Georgia', serif" font-style="italic" font-size="20" fill="#334155" text-anchor="middle">for successfully completing the 4 credit course</text>
  
  <text x="500" y="325" font-family="'Georgia', serif" font-weight="bold" font-size="28" fill="#1e293b" text-anchor="middle">Programming in Python</text>
  
  <text x="500" y="365" font-family="'Georgia', serif" font-style="italic" font-size="20" fill="#334155" text-anchor="middle">with a consolidated score of <tspan font-weight="bold" font-style="normal" fill="#0f172a">57%</tspan></text>
  
  <text x="500" y="400" font-family="'Georgia', serif" font-style="italic" font-size="17" fill="#475569" text-anchor="middle">from the evaluation based on continuous online assessments and the proctored</text>
  <text x="500" y="425" font-family="'Georgia', serif" font-style="italic" font-size="17" fill="#475569" text-anchor="middle">examination held in month of May 2024.</text>

  <text x="500" y="465" font-family="'Georgia', serif" font-style="italic" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">This course was offered by Dr. Rizwan Rehman of Dibrugarh University</text>

  <!-- Roll No Box -->
  <g transform="translate(800, 220)">
    <rect x="0" y="0" width="130" height="30" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="65" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">Roll No: TN23065104</text>
  </g>

  <!-- Marks Table -->
  <g transform="translate(160, 490)">
    <rect x="0" y="0" width="680" height="90" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Table Headers -->
    <line x1="225" y1="0" x2="225" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="455" y1="0" x2="455" y2="90" stroke="#94a3b8" stroke-width="1.5"/>
    
    <line x1="0" y1="30" x2="680" y2="30" stroke="#94a3b8" stroke-width="1"/>
    <line x1="0" y1="60" x2="680" y2="60" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Column Sub-lines -->
    <line x1="112" y1="30" x2="112" y2="90" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="340" y1="30" x2="340" y2="90" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="567" y1="30" x2="567" y2="90" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Header Text -->
    <text x="112" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Marks in Online Assignments</text>
    <text x="340" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Marks in Proctored Exam</text>
    <text x="567" y="20" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a" text-anchor="middle">Total Score</text>

    <text x="56" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Total</text>
    <text x="168" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Obtained</text>

    <text x="282" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Total</text>
    <text x="397" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Obtained</text>

    <text x="511" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Total</text>
    <text x="623" y="48" font-family="sans-serif" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Obtained</text>

    <!-- Score Values -->
    <text x="56" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">30</text>
    <text x="168" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="middle">29</text>

    <text x="282" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">70</text>
    <text x="397" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="middle">28</text>

    <text x="511" y="80" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="middle">100</text>
    <text x="623" y="80" font-family="sans-serif" font-size="15" font-weight="bold" fill="#16a34a" text-anchor="middle">57</text>
  </g>

  <!-- Signatures -->
  <g transform="translate(160, 600)">
    <path d="M 20 25 Q 50 5 80 20 T 140 10" fill="none" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">J. B. Nadda</text>
    <text x="80" y="58" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">National Coordinator, CEC</text>
  </g>

  <g transform="translate(700, 600)">
    <path d="M 20 15 Q 50 30 80 10 T 130 25" fill="none" stroke="#1e293b" stroke-width="2"/>
    <text x="80" y="45" font-family="sans-serif" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">Dr. Prasanta Kr. Kakoty</text>
    <text x="80" y="58" font-family="sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Controller of Examinations, Dibrugarh Univ.</text>
  </g>

  <!-- Footer Info -->
  <text x="40" y="665" font-family="sans-serif" font-size="10" fill="#64748b">Issued On : 21/06/2024</text>
  <text x="960" y="665" font-family="sans-serif" font-size="10" fill="#64748b" text-anchor="end">To validate and check scores: https://swayam.gov.in</text>
</svg>
